name: JS (release)

on:
  push:
    branches:
      - main
    paths:
      - 'visual-js/.changeset/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: visual-js

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      # npm 11.5.1+ supports Trusted Publishing. npm 12 changed `npm info --json` to return a list,
      # which changesets reads as "never published", so it tries to republish every package.
      - name: Update npm to a version that supports Trusted Publishing
        run: npm install -g npm@11
      - name: Setup Git
        if: ${{ steps.prep.outputs.tag_name == '' }}
        run: |
          git config --global user.name "sauce-visual-bot"
          git config --global user.email "visual@saucelabs.com"
      - name: Build
        run: |
          npm install
          npx changeset status --output=changeset.json
          ./replace_pkg_version.sh changeset.json
          npm run build --workspaces --if-present
      - name: upgrade & publish version(s)
        run: |
          npx changeset version
          npx changeset publish
      - name: Push to git
        run: git push --follow-tags
